name: Release
run-name: Publish Stemmio ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already merged to main
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: release-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: publish-verified-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Require exact version on current main
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          test "$REQUESTED_VERSION" = "$(node -p "require('./package.json').version")"
          test "$REQUESTED_VERSION" = "$(node -p "require('./package-lock.json').packages[''].version")"
      - name: Resolve the user-facing CHANGELOG notes for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --out output/release-metadata/release-notes.md
          test -s output/release-metadata/release-notes.md
      - name: Resolve fresh exact-tree pre-tag candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-candidate-resolve
          --stage publish
          --
          node scripts/release-candidate-provenance.mjs resolve
          --repository "$GITHUB_REPOSITORY"
          --workflow release-candidate.yml
          --architecture arm64
          --max-age-hours 72
          --github-output "$GITHUB_OUTPUT"
      - name: Download frozen candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_ARTIFACT: ${{ steps.candidate.outputs.artifact_name }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-candidate-download
          --stage publish
          --
          gh run download "$CANDIDATE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "$CANDIDATE_ARTIFACT"
          --dir output/downloaded-release-candidate
      - name: Verify downloaded provenance and every asset byte
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-candidate-verify
          --stage publish
          --
          node scripts/release-candidate-provenance.mjs verify
          --repository "$GITHUB_REPOSITORY"
          --architecture arm64
          --directory output/downloaded-release-candidate
          --run-id "$CANDIDATE_RUN_ID"
          --run-attempt "$CANDIDATE_RUN_ATTEMPT"
      - name: Refresh exact package contents and current Pull Request states
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          node scripts/package-delivery-report.mjs
          --kind formal
          --artifact "output/downloaded-release-candidate/Stemmio-${VERSION}-arm64.dmg"
          --version "$VERSION"
          --architecture arm64
          --repository "$GITHUB_REPOSITORY"
          --output output/package-delivery
      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Stemmio-release-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-evidence
            output/package-delivery
          if-no-files-found: warn
          retention-days: 30
      - name: Validate public distribution destinations before tagging
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.STEMMIO_PUBLIC_RELEASES_TOKEN }}
          PUBLIC_RELEASES_REPOSITORY: Charleyli925/Stemmio-Releases
          LEGACY_UPDATE_BRIDGE_REPOSITORY: Charleyli925/PageRoot
          LEGACY_UPDATE_BRIDGE_VERSION: 0.9.90
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$PUBLIC_RELEASES_TOKEN" || {
            echo "STEMMIO_PUBLIC_RELEASES_TOKEN is required to publish the public distribution release." >&2
            exit 1
          }
          repositories=("$PUBLIC_RELEASES_REPOSITORY")
          if [ "$VERSION" = "$LEGACY_UPDATE_BRIDGE_VERSION" ]; then
            repositories+=("$LEGACY_UPDATE_BRIDGE_REPOSITORY")
          fi
          for repository in "${repositories[@]}"; do
            test "$(GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh api "repos/$repository" --jq '.full_name')" = "$repository" || {
              echo "The configured public distribution repository must resolve to its exact repository name: $repository" >&2
              exit 1
            }
            test "$(GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh api "repos/$repository" --jq '.private')" = "false" || {
              echo "The configured public distribution repository must be public: $repository" >&2
              exit 1
            }
          done
      - name: Create or safely resume the immutable annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
            echo "Resuming publication from the existing exact annotated tag $TAG."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Stemmio ${VERSION}"
            git push origin "refs/tags/$TAG"
          fi
      - name: Publish immutable public GitHub Releases
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.STEMMIO_PUBLIC_RELEASES_TOKEN }}
          PUBLIC_RELEASES_REPOSITORY: Charleyli925/Stemmio-Releases
          LEGACY_UPDATE_BRIDGE_REPOSITORY: Charleyli925/PageRoot
          LEGACY_UPDATE_BRIDGE_VERSION: 0.9.90
          VERSION: ${{ inputs.version }}
        run: |
          CANDIDATE_DIRECTORY="output/downloaded-release-candidate"
          TAG="v${VERSION}"
          test -n "$PUBLIC_RELEASES_TOKEN" || {
            echo "STEMMIO_PUBLIC_RELEASES_TOKEN is required to publish the public distribution release." >&2
            exit 1
          }
          assets=(
            "Stemmio-${VERSION}-arm64.dmg"
            "Stemmio-${VERSION}-arm64.zip"
            "Stemmio-${VERSION}-arm64.zip.blockmap"
            "latest-mac.yml"
            "SHA256SUMS.txt"
            "build-info.json"
            "release-candidate.json"
          )

          verify_existing_legacy_bridge() {
            local repository="$1"
            local downloaded="output/downloaded-legacy-update-bridge"
            local expected_assets
            local actual_assets
            test "$(GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release view "$TAG" --repo "$repository" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = "false" || {
              echo "Legacy updater bridge release must be a published stable release." >&2
              exit 1
            }
            expected_assets="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
            actual_assets="$(GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release view "$TAG" --repo "$repository" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
            test "$actual_assets" = "$expected_assets" || {
              echo "Legacy updater bridge asset set differs from the frozen candidate." >&2
              exit 1
            }
            rm -rf "$downloaded"
            mkdir -p "$downloaded"
            GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release download "$TAG" \
              --repo "$repository" \
              --dir "$downloaded"
            cmp -s output/release-metadata/release-notes.md <(
              GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release view "$TAG" \
                --repo "$repository" \
                --json body \
                --jq .body
            ) || {
              echo "Legacy updater bridge notes differ from the reviewed release notes." >&2
              exit 1
            }
            test "$(GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release view "$TAG" --repo "$repository" --json name --jq .name)" = "Stemmio ${VERSION}" || {
              echo "Legacy updater bridge title differs from the reviewed release title." >&2
              exit 1
            }
            for asset in "${assets[@]}"; do
              test -f "$downloaded/$asset" || {
                echo "Legacy updater bridge is missing $asset." >&2
                exit 1
              }
              cmp -s "$CANDIDATE_DIRECTORY/$asset" "$downloaded/$asset" || {
                echo "Legacy updater bridge asset differs from the frozen candidate: $asset" >&2
                exit 1
              }
            done
          }

          publish_release() {
            local repository="$1"
            local allow_resume="$2"
            if GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release view "$TAG" --repo "$repository" >/dev/null 2>&1; then
              if [ "$allow_resume" != "true" ]; then
                echo "Public Release $TAG already exists; refusing to replace immutable assets." >&2
                exit 1
              fi
              verify_existing_legacy_bridge "$repository"
              echo "Existing exact legacy updater bridge release $TAG is retained."
              return
            fi
            if GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh api "repos/$repository/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "Public release tag $TAG already exists without a releasable immutable bridge." >&2
              exit 1
            fi
            local release_assets=()
            for asset in "${assets[@]}"; do
              release_assets+=("$CANDIDATE_DIRECTORY/$asset")
            done
            GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release create "$TAG" \
              "${release_assets[@]}" \
              --repo "$repository" \
              --target main \
              --notes-file output/release-metadata/release-notes.md \
              --title "Stemmio ${VERSION}"
          }

          if [ "$VERSION" = "$LEGACY_UPDATE_BRIDGE_VERSION" ]; then
            publish_release "$LEGACY_UPDATE_BRIDGE_REPOSITORY" true
          fi
          publish_release "$PUBLIC_RELEASES_REPOSITORY" false
