name: CI Health

on:
  schedule:
    # Weekly report generated on GitHub-hosted runners. Automatic Issue
    # creation stays off until wash-green and flaky metrics are trustworthy.
    # The workflow never writes repository contents and is not a merge gate.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-health
  cancel-in-progress: true

jobs:
  report:
    name: ci-health-report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Generate the 30-day CI health report
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci-health-report.mjs
          --repository "$GITHUB_REPOSITORY"
          --days 30
      - name: Publish the report to the run summary
        timeout-minutes: 2
        run: cat output/ci-health/ci-health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the CI health report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 10
        with:
          name: Stemmio-ci-health-${{ github.run_id }}
          path: |
            output/ci-health/ci-health.json
            output/ci-health/ci-health.md
          if-no-files-found: error
          retention-days: 30
