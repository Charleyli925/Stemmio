name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Draft opens/pushes run impact-selected feedback only. A non-draft PR
    # (Ready transition or opened already Ready) runs the complete source
    # matrix. Returning to Draft starts no full gate.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: write

concurrency:
  # A superseded pull-request head is safe to cancel because only the newest
  # head can merge. A push to main is not: successive auto-merges land as
  # separate commits that each need their own integrity verification, so a
  # later merge must never cancel an earlier commit's main-integrity run.
  group: >-
    ${{ github.event_name == 'push'
    && format('stemmio-main-{0}', github.sha)
    || format('stemmio-pr-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  pr-feedback-plan:
    name: pr-feedback-plan
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_browser: ${{ steps.plan.outputs.has_browser }}
      has_desktop: ${{ steps.plan.outputs.has_desktop }}
      planned_selection: ${{ steps.plan.outputs.planned_selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Enforce Stemmio branch naming
        timeout-minutes: 2
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: npm run task:policy -- "$BRANCH_NAME"
      - name: Freeze the Draft test plan
        id: plan
        timeout-minutes: 2
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node scripts/test-gate.mjs plan
          --base "$PR_BASE_SHA"
          --for draft
          --github-output "$GITHUB_OUTPUT"

  pr-feedback-linux:
    name: pr-feedback-linux
    needs: pr-feedback-plan
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Setup npm without Electron
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 15
        with:
          skip-electron: "true"
          install-mode: populate
      - name: Restore Playwright Chromium
        if: needs.pr-feedback-plan.outputs.has_browser == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 5
        if: needs.pr-feedback-plan.outputs.has_browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Run Draft Node and Browser canaries
        timeout-minutes: 15
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT_PLANNED_SELECTION: ${{ needs.pr-feedback-plan.outputs.planned_selection }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite pr-feedback
          --stage pr-feedback
          --
          npm run gate:draft -- --base "$PR_BASE_SHA" --runtime node,browser
          --planned-selection "$DRAFT_PLANNED_SELECTION"
      - name: Upload Linux feedback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-pr-feedback-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-evidence
            output/test-runs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Linux Playwright diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-pr-feedback-linux-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 14

  pr-feedback-desktop:
    name: pr-feedback-desktop
    needs:
      - pr-feedback-plan
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
      && needs.pr-feedback-plan.outputs.has_desktop == 'true'
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Setup npm with Electron
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 15
        with:
          skip-electron: "false"
          install-mode: populate
      - name: Run Draft Electron and AI canaries
        timeout-minutes: 30
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT_PLANNED_SELECTION: ${{ needs.pr-feedback-plan.outputs.planned_selection }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite pr-feedback-desktop
          --stage pr-feedback
          --
          npm run gate:draft -- --base "$PR_BASE_SHA" --runtime electron,ai
          --planned-selection "$DRAFT_PLANNED_SELECTION"
      - name: Upload desktop feedback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-pr-feedback-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-evidence
            output/test-runs
            output/design-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Upload desktop Playwright diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-pr-feedback-desktop-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 14

  pr-feedback:
    name: pr-feedback
    needs:
      - pr-feedback-plan
      - pr-feedback-linux
      - pr-feedback-desktop
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Draft Node/Browser and any selected desktop canaries
        timeout-minutes: 1
        env:
          LINUX_RESULT: ${{ needs.pr-feedback-linux.result }}
          DESKTOP_RESULT: ${{ needs.pr-feedback-desktop.result }}
          HAS_DESKTOP: ${{ needs.pr-feedback-plan.outputs.has_desktop }}
        run: |
          test "$LINUX_RESULT" = "success"
          if test "$HAS_DESKTOP" = "true"; then
            test "$DESKTOP_RESULT" = "success"
          else
            test "$DESKTOP_RESULT" = "skipped"
          fi

  codex-review:
    name: codex-review
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Request one informational Codex review for the current head
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/request-codex-review.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "${{ github.event.pull_request.number }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Snapshot current review threads without blocking merge
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-pr-review-policy.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "${{ github.event.pull_request.number }}"
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --expected-base "${{ github.event.pull_request.base.sha }}"
      - name: Upload review snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-review-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/review-policy/review-policy.json
          if-no-files-found: warn
          retention-days: 30

  branch-policy:
    name: branch-policy
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Enforce Stemmio branch naming
        timeout-minutes: 2
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: npm run task:policy -- "$BRANCH_NAME"

  candidate-context:
    name: candidate-context
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging_required: ${{ steps.classify.outputs.packaging_required }}
      advisory_scope: ${{ steps.classify.outputs.advisory_scope }}
      advisory_size: ${{ steps.classify.outputs.advisory_size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Classify candidate packaging risk without imposing a PR-size limit
        timeout-minutes: 5
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/classify-pr-candidate.mjs
          --base "$PR_BASE_SHA"
          --head "$PR_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  release-dry-run:
    name: release-dry-run
    needs: candidate-context
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && needs.candidate-context.outputs.packaging_required == 'true'
    uses: ./.github/workflows/release-dry-run.yml
    with:
      pull_request_number: ${{ github.event.pull_request.number }}
      source_head: ${{ github.event.pull_request.head.sha }}

  baseline-policy:
    name: baseline-policy
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Install baseline policy runtime
        timeout-minutes: 10
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies and packaged runtime closure
        timeout-minutes: 10
        run: >-
          node scripts/check-dependency-audit.mjs
          --write-snapshot output/ci-evidence/dependency-audit.json
      - name: Upload dependency audit snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: Stemmio-dependency-audit-${{ github.run_id }}
          path: output/ci-evidence/dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  linux-deps:
    name: linux-deps
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - baseline-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Populate Linux npm cache without Electron
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 15
        with:
          skip-electron: "true"
          install-mode: populate

  macos-deps:
    name: macos-deps
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - baseline-policy
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Populate macOS npm cache
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 15
        with:
          skip-electron: "false"
          install-mode: populate

  source-build:
    name: source-build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - baseline-policy
      - linux-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Restore Linux npm cache without Electron
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 10
        with:
          skip-electron: "true"
          install-mode: require-cache
      - name: Run static checks and build the shared web renderer
        timeout-minutes: 15
        run: >-
          node scripts/ci-evidence.mjs run
          --suite source-build
          --stage source-build
          --
          npm run ci:source-build
      - name: Upload shared web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-web-build-${{ github.run_id }}
          path: |
            dist
            package.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-source-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-node:
    name: source-node
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - source-build
      - linux-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Restore Linux npm cache without Electron
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 10
        with:
          skip-electron: "true"
          install-mode: require-cache
      - name: Download shared web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-web-build-${{ github.run_id }}
          path: .
      - name: Run full Node suite
        timeout-minutes: 15
        run: >-
          node scripts/ci-evidence.mjs run
          --suite source-node
          --stage source-test
          --
          node scripts/test-node-group.mjs full
      - name: Upload Node evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-source-node-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-browser:
    name: browser-${{ matrix.label }}
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - source-build
      - linux-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: shard-1-of-3
            command: npx playwright test --config tests/e2e/browser/playwright.config.mjs --fully-parallel --workers=1 --shard=1/3
          - label: shard-2-of-3
            command: npx playwright test --config tests/e2e/browser/playwright.config.mjs --fully-parallel --workers=1 --shard=2/3
          - label: shard-3-of-3
            command: npx playwright test --config tests/e2e/browser/playwright.config.mjs --fully-parallel --workers=1 --shard=3/3
          - label: dom-editing-compatibility
            command: npx playwright test --config tests/e2e/browser/playwright.real-html.config.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Restore Linux npm cache without Electron
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 10
        with:
          skip-electron: "true"
          install-mode: require-cache
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 5
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Probe Playwright Chromium host readiness
        id: playwright-host
        timeout-minutes: 2
        # The hosted image normally already carries Chromium's shared-library
        # prerequisites. Launch the restored or freshly installed browser
        # first, so every matrix lane avoids apt when those prerequisites are
        # present.
        run: |
          if node -e 'const { chromium } = require("playwright"); (async () => { const browser = await chromium.launch({ headless: true }); await browser.close(); })().catch((error) => { console.error(error.message); process.exit(1); });'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Playwright system dependencies when required
        if: steps.playwright-host.outputs.ready != 'true'
        timeout-minutes: 10
        # Do not kill a slow apt parent mid-install: its child can keep the
        # dpkg lock and make a retry fail immediately. This fallback is only
        # reached when the launch probe proves the runner lacks a library.
        run: >-
          node scripts/ci-evidence.mjs run
          --suite browser-${{ matrix.label }}-install-deps
          --stage environment-preflight
          --
          npx playwright install-deps chromium
      - name: Download shared web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-web-build-${{ github.run_id }}
          path: .
      - name: Run ${{ matrix.label }}
        timeout-minutes: 15
        run: >-
          node scripts/ci-evidence.mjs run
          --suite browser-${{ matrix.label }}
          --stage source-test
          --
          ${{ matrix.command }}
      - name: Record Playwright retry evidence
        # Runs even after a failed suite so flaky/retry counts and the first
        # attempt's artifacts are never lost with the runner. The DOM compatibility
        # oracle stays retry-free with no JSON reporter, so it is excluded.
        if: always() && matrix.label != 'dom-editing-compatibility'
        timeout-minutes: 5
        run: >-
          node scripts/playwright-flaky-summary.mjs
          --report output/playwright/native-dom-browser/results.json
          --suite browser-${{ matrix.label }}
      - name: Upload browser failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-browser-${{ matrix.label }}-diagnostics-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-browser-${{ matrix.label }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-electron-native:
    name: electron-native-${{ matrix.label }}
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - baseline-policy
      - macos-deps
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 40 self-contained tests at workers=1 ran as a single ~12 minute lane
      # that dominated total gate latency. Sharding spreads them across
      # runners that still use one worker each, so no two Electron apps ever
      # share a runner. --fully-parallel is what makes Playwright shard at
      # test granularity; without it this two-spec suite shards by file and
      # one shard would keep almost every test.
      matrix:
        include:
          - label: shard-1-of-3
            shard: 1/3
          - label: shard-2-of-3
            shard: 2/3
          - label: shard-3-of-3
            shard: 3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Restore macOS npm cache
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 10
        with:
          skip-electron: "false"
          install-mode: require-cache
      - name: Prove hosted renderer scheduling before product tests
        timeout-minutes: 5
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-native-${{ matrix.label }}-preflight
          --stage environment-preflight
          --
          npm run test:electron:ci-preflight
      - name: Build Electron renderer on the target OS
        timeout-minutes: 5
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-native-${{ matrix.label }}-renderer
          --stage source-build
          --
          npm run desktop:renderer
      - name: Run native Electron suite
        timeout-minutes: 30
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-native-${{ matrix.label }}
          --stage source-test
          --
          npx playwright test --config tests/e2e/electron/playwright.config.mjs
          --fully-parallel --workers=1 --shard=${{ matrix.shard }}
      - name: Record Playwright retry evidence
        timeout-minutes: 5
        # Runs even after a failed suite so the flaky/retry counts and the
        # first attempt's artifacts are never lost with the runner.
        if: always()
        run: >-
          node scripts/playwright-flaky-summary.mjs
          --report output/playwright/native-dom-electron/results.json
          --suite electron-native-${{ matrix.label }}
      - name: Upload native Electron diagnostics and retry evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-electron-native-${{ matrix.label }}-diagnostics-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload native Electron evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-electron-native-${{ matrix.label }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-electron-ai:
    name: electron-ai
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
    needs:
      - baseline-policy
      - macos-deps
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Restore macOS npm cache
        uses: ./.github/actions/setup-stemmio-npm
        timeout-minutes: 10
        with:
          skip-electron: "false"
          install-mode: require-cache
      - name: Prove hosted renderer scheduling before AI tests
        timeout-minutes: 5
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-ai-preflight
          --stage environment-preflight
          --
          npm run test:electron:ci-preflight
      - name: Build Electron renderer on the target OS
        timeout-minutes: 5
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-ai-renderer
          --stage source-build
          --
          npm run desktop:renderer
      - name: Run deterministic AI closed-loop suite
        timeout-minutes: 30
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-ai
          --stage source-test
          --
          npx playwright test --config tests/e2e/electron/playwright.ai-closed-loop.config.mjs
      - name: Record Playwright retry evidence
        timeout-minutes: 5
        if: always()
        run: >-
          node scripts/playwright-flaky-summary.mjs
          --report output/playwright/ai-closed-loop/deterministic/results.json
          --suite electron-ai
      - name: Upload AI Electron diagnostics and retry evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-electron-ai-diagnostics-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload AI Electron evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-electron-ai-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-evidence
            output/design-qa
          if-no-files-found: warn
          retention-days: 30

  release-gate:
    # GitHub accepts skipped required checks. Only a Ready run may publish
    # the required name; cancellation must still reach the lane verdict.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && 'release-gate' || 'release-gate-inactive' }}
    if: >-
      ${{ always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft == false }}
    needs:
      - baseline-policy
      - branch-policy
      - candidate-context
      - release-dry-run
      - source-build
      - source-node
      - source-browser
      - source-electron-native
      - source-electron-ai
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every source lane
        timeout-minutes: 2
        env:
          BASELINE_RESULT: ${{ needs.baseline-policy.result }}
          POLICY_RESULT: ${{ needs.branch-policy.result }}
          CANDIDATE_CONTEXT_RESULT: ${{ needs.candidate-context.result }}
          PACKAGING_REQUIRED: ${{ needs.candidate-context.outputs.packaging_required }}
          DRY_RUN_RESULT: ${{ needs.release-dry-run.result }}
          BUILD_RESULT: ${{ needs.source-build.result }}
          NODE_RESULT: ${{ needs.source-node.result }}
          BROWSER_RESULT: ${{ needs.source-browser.result }}
          ELECTRON_NATIVE_RESULT: ${{ needs.source-electron-native.result }}
          ELECTRON_AI_RESULT: ${{ needs.source-electron-ai.result }}
        run: |
          {
            echo "## Source lane results"
            echo ""
            echo "| lane | result |"
            echo "|---|---|"
            echo "| baseline-policy | $BASELINE_RESULT |"
            echo "| branch-policy | $POLICY_RESULT |"
            echo "| candidate-context | $CANDIDATE_CONTEXT_RESULT |"
            echo "| release-dry-run (packaging_required=$PACKAGING_REQUIRED) | $DRY_RUN_RESULT |"
            echo "| source-build | $BUILD_RESULT |"
            echo "| source-node | $NODE_RESULT |"
            echo "| browser lanes | $BROWSER_RESULT |"
            echo "| electron-native shards | $ELECTRON_NATIVE_RESULT |"
            echo "| electron-ai | $ELECTRON_AI_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$BASELINE_RESULT" = "success"
          test "$POLICY_RESULT" = "success"
          test "$CANDIDATE_CONTEXT_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$NODE_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$ELECTRON_NATIVE_RESULT" = "success"
          test "$ELECTRON_AI_RESULT" = "success"
          if test "$PACKAGING_REQUIRED" = "true"; then
            test "$DRY_RUN_RESULT" = "success"
          else
            test "$PACKAGING_REQUIRED" = "false"
            test "$DRY_RUN_RESULT" = "skipped"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Download product flaky evidence
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Stemmio-*-evidence-${{ github.run_id }}-*
          merge-multiple: false
          path: output/ci-evidence-attempts
      - name: Select source-gate evidence
        timeout-minutes: 2
        run: >-
          node scripts/select-source-gate-evidence.mjs
          --from output/ci-evidence-attempts
          --to output/ci-evidence
          --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Download dependency audit snapshot
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Stemmio-dependency-audit-${{ github.run_id }}
          path: output/ci-evidence
      - name: Install baseline verification runtime
        timeout-minutes: 10
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify dependency and packaged-runtime baseline is unchanged
        timeout-minutes: 2
        run: >-
          node scripts/check-dependency-audit.mjs
          --verify-snapshot output/ci-evidence/dependency-audit.json
      - name: Create exact-tree source gate attestation
        timeout-minutes: 5
        id: provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Bind the tested merge commit to the still-current Ready PR before
          # issuing evidence. Strict branch protection closes later base drift.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg head "$PR_HEAD_SHA" --arg base "$PR_BASE_SHA" --arg merge "$GITHUB_SHA" \
            '.state == "open" and .draft == false and .head.sha == $head
             and .base.ref == "main" and .base.sha == $base and .merge_commit_sha == $merge'
          node scripts/source-gate-provenance.mjs create \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$PR_NUMBER" \
            --pull-request-head "$PR_HEAD_SHA" \
            --pull-request-base "$PR_BASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-dir output/ci-evidence \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload exact-tree source gate attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: output/source-gate/source-gate.json
          if-no-files-found: error
          retention-days: 30

  main-integrity:
    name: main-integrity
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
      - name: Verify PR result, exact tree, version and freshness
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/source-gate-provenance.mjs verify \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --max-age-hours 168 \
            --mode required \
            --missing-association fail
