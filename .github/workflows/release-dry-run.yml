name: Release Dry Run
run-name: "Credential-free release dry run for candidate ${{ inputs.pull_request_number }}"

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: "Candidate Pull Request number for evidence labels"
        required: true
        type: string
      source_head:
        description: "Exact final candidate head SHA"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Candidate Pull Request number or manual label"
        required: false
        default: "manual"
        type: string
      source_head:
        description: "Exact candidate SHA or ref to dry run"
        required: true
        default: "main"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-dry-run-${{ inputs.pull_request_number || inputs.source_head || github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assemble-and-checkpoint-unsigned-app
    runs-on: macos-14
    timeout-minutes: 35
    outputs:
      checkpoint_artifact: ${{ steps.checkpoint.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron and builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-release-dry-run-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        timeout-minutes: 10
      - name: Build the first clean-job renderer oracle
        timeout-minutes: 5
        run: npm run desktop:renderer
      - name: Generate synthetic telemetry and build metadata and assemble the unsigned App
        timeout-minutes: 15
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-assemble
          --stage artifact-preflight
          --
          node scripts/build-package.mjs
          --arch arm64
          --profile release-dry-run
      - name: Verify app.asar, Bridge, schemas, resources and metadata
        timeout-minutes: 5
        env:
          STEMMIO_REQUIRE_TELEMETRY_CONFIG: "1"
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-verify
          --stage artifact-preflight
          --
          node scripts/verify-packaged-artifact.mjs
          --arch arm64
          --profile release-dry-run
      - name: Create the non-release dry-run checkpoint
        id: checkpoint
        timeout-minutes: 10
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-checkpoint
          --stage artifact-checkpoint
          --
          node scripts/release-app-checkpoint.mjs create-dry-run
          --arch arm64
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output output/release-dry-run-checkpoint/bundle
          --github-output "$GITHUB_OUTPUT"
      - name: Upload the non-release dry-run checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          path: ${{ steps.checkpoint.outputs.checkpoint_directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload assembly failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-release-dry-run-assembly-diagnostics-${{ github.run_attempt }}
          path: |
            output/test-runs
            output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload assembly CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-release-dry-run-assembly-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  restore:
    name: restore-rebuild-oracles-and-launch
    needs: assemble
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron and builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-release-dry-run-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        timeout-minutes: 10
      - name: Download the exact dry-run checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.assemble.outputs.checkpoint_artifact }}
          path: output/release-dry-run-checkpoint/downloaded
      - name: Verify and restore payload plus build and telemetry metadata
        id: restore
        timeout-minutes: 10
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-restore
          --stage artifact-checkpoint
          --
          node scripts/release-app-checkpoint.mjs restore-dry-run
          --arch arm64
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --directory output/release-dry-run-checkpoint/downloaded
          --output output/release-dry-run/restored
          --github-output "$GITHUB_OUTPUT"
      - name: Rebuild the renderer oracle in the second clean job
        timeout-minutes: 5
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-renderer
          --stage artifact-checkpoint
          --
          npm run desktop:renderer
      - name: Revalidate the restored payload and metadata
        timeout-minutes: 5
        env:
          STEMMIO_REQUIRE_TELEMETRY_CONFIG: "1"
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-revalidate
          --stage artifact-checkpoint
          --
          node scripts/verify-packaged-artifact.mjs
          --arch arm64
          --profile release-dry-run
          --app-path "${{ steps.restore.outputs.app_path }}"
      - name: Launch and verify product name, version and Bundle ID
        timeout-minutes: 10
        env:
          STEMMIO_PACKAGED_APP_PATH: ${{ steps.restore.outputs.app_path }}
          STEMMIO_TEST_ARCH: arm64
        run: >-
          node scripts/ci-evidence.mjs run
          --suite release-dry-run-startup
          --stage artifact-checkpoint
          --
          npm run test:packaged-startup
      - name: Upload restore failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-release-dry-run-restore-diagnostics-${{ github.run_attempt }}
          path: |
            output/test-runs
            output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload restore CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: Stemmio-release-dry-run-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30
