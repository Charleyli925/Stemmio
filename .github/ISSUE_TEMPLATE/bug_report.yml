name: Internal bug report
description: Record a reproducible Stemmio source or CI problem for authorized collaborators
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Internal source issue. Remove personal information and confidential HTML before submitting.
  - type: input
    id: version
    attributes:
      label: Stemmio version
      placeholder: 0.8.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and hardware
      placeholder: macOS 15.5, Apple M2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Safety check
      options:
        - label: This report does not contain a security vulnerability or sensitive data.
          required: true
